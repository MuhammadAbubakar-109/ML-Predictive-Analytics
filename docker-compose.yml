services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: [./backend/.env.example]
    volumes:
      - ./backend/models:/app/models:ro   # run `make train` first
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [backend]
