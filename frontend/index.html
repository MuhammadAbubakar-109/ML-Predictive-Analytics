<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Estimate loan default risk, compare five models and stress-test the answer." />
    <meta name="theme-color" content="#0E1A2E" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230E1A2E'/%3E%3Cpath d='M7 21a9 9 0 1 1 18 0' fill='none' stroke='%238FA3FF' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M16 21l5-7' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Loan Default Predictor</title>

    <!-- Fonts: falls back to system fonts when offline -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap"
    />

    <!-- Apply the saved theme before first paint so the page never flashes the wrong colours -->
    <script>
      try {
        var mode = JSON.parse(localStorage.getItem("lc.theme") || '"system"');
        if (mode === "light" || mode === "dark") document.documentElement.dataset.theme = mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
